[package]
name = "ikigai-sexpr"
version = "0.1.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Neutral, language-agnostic s-expression foundation for ikigai's portable-code arc: a `Sexpr` datum + reader/printer, pure kernel-free compilers (escaping/validation, never interpolation) turning s-exprs into SPARQL (`urn:sparql:from-sexpr` → application/sparql-query) and into an RDF graph as Turtle (`urn:rdf:from-sexpr` → text/turtle), and a kernel's arrangement as an s-expression, transrepted losslessly to and from the ik: Turtle core builds a space from (`urn:sexpr:arrangement-to-rdf`, text/x-ikigai-arrangement) — with no lisp engine at all."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-sexpr"
homepage = "https://github.com/ikigai-rs/ikigai-sexpr"
keywords = ["ikigai", "roc", "sexpr", "sparql", "transreptor"]
categories = ["compilers", "parser-implementations"]

[dependencies]
# The published kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core`. 0.1.84 is the floor because the arrangement
# surface relies on core's declaration BOUNDS (`MAX_DECLARATION_DEPTH`/`_NODES`/`_TEXT` and
# `DeclarationError::TooLarge`, new in 0.1.84): `Topology::from_turtle` refuses an oversized
# document itself, so this crate no longer measures Turtle before handing it over, and the
# s-expression reader counts in core's units so the two refuse alike. It goes THROUGH core's
# `Topology` (`Door`, `MatchKind`, `TopologyRule`, and `Topology::from_turtle` behind the
# `declare` feature, 0.1.78–0.1.83) as before.
# ⚠ Under 0.x caret rules this is also a CEILING: `^0.1.84` admits 0.1.84 up to, not
# including, 0.2.0. `declare` brings `oxttl` and `oxrdf`.
# The `Sexpr` datum, reader, printer, and the SPARQL/Turtle compilers stay kernel-free.
ikigai-core = { version = "0.1.84", features = ["declare"] }
async-trait = "0.1"

# Slice 3c.2 lossless code-as-graph: the encoder content-addresses cons cells with a
# deterministic hash, and the decoder parses the emitted Turtle back to a `Sexpr`. Both
# live in the PURE (kernel-free) layer, so these are runtime — not dev — deps, behind the
# `full` feature (see [features]): the arrangement surface needs none of them.
# `sha2` (RustCrypto) and Oxigraph's pure-Rust `oxrdf`/`oxrdfio` are all wasm-clean.
sha2 = { version = "0.10", optional = true }
oxrdf = { version = "0.3", optional = true }
oxrdfio = { version = "0.2", optional = true }

# oxrdf (through core's `declare`, and directly under `full`) pulls getrandom 0.3; its wasm
# backend must be selected explicitly (paired with the `getrandom_backend` cfg in
# .cargo/config.toml) so the lib still builds for wasm32 — the crate's browser face. Not
# used directly.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
# Every surface, and `space()`, which mounts them all: the query and graph compilers as
# endpoints (`urn:sparql:from-sexpr`, `urn:rdf:from-sexpr`) and the lossless code-graph codec
# (`sexpr_to_rdf`/`rdf_to_sexpr`, `urn:sexpr:to-rdf`/`from-rdf`). On by default, so a
# consumer that says nothing gets exactly what 0.1.4 gave it.
#
# Off (`default-features = false`), the crate is the datum, its reader and printer, the two
# pure compilers, and the ARRANGEMENT surface — `arrangement_space()` and the functions it
# is built from — compiling neither `sha2` nor `oxrdfio` (and so neither of oxrdfio's RDF/XML
# and JSON-LD parsers). That is the build for a page that only reads arrangements: ledger
# #649 measured the tutorial's tic-tac-toe page paying ~170 KB gzip for surfaces it never
# mounted. CI's `arrangement only` job holds this configuration to the same gates.
default = ["full"]
full = ["dep:sha2", "dep:oxrdf", "dep:oxrdfio"]

[dev-dependencies]
futures = "0.3" # block_on for the async endpoint test
# The module recipe as one test (`tests/conformance.rs`): walks every endpoint
# `space()` binds and reports every violation of the recipe at once. Dev-dep ONLY.
ikigai-conformance = "0.2.0"
# Not used directly: the floor for the vocabulary conformance checks the Turtle faces
# against. The arrangement Turtle uses the ik: arrangement terms (ik:Door, ik:doors,
# ik:endpointName, ik:matchKind, ik:RewriteRule, …), which ikigai-vocab defines from
# 0.1.83; conformance 0.2.0 asks only for ^0.1.69, which would resolve short of them.
ikigai-vocab = "0.1.83"
# The real SPARQL engine, so the transreptor's emitted query is proven to RUN
# end-to-end (`urn:sparql:select` over its always-loaded vocabulary graph). Dev-dep
# ONLY. `0.1.5` pins ikigai-core `0.1.35` (caret), unifying with ours to one kernel
# type across the test build.
ikigai-sparql = "0.1.5"
# `oxrdf`/`oxrdfio` (the Oxigraph Turtle parser the graph tests re-parse output with) are
# now runtime deps — see [dependencies] — so no dev-only entry is needed. The 3c validity
# tests and the 3c.2 round-trip/content-addressing tests re-parse output from there.
# The full Oxigraph engine (the same one `ikigai-sparql` wraps) as a dev-dep ONLY, to run a
# real SPARQL query over an ENCODED program — proving the 3c.2 code-graph is govern-queryable.
oxigraph = { version = "0.5", default-features = false }

# The module recipe walks every endpoint `space()` binds, and `space()` is the `full` surface.
# Default features cover it, so the shared CI gates (which run defaults) still see it.
[[test]]
name = "conformance"
required-features = ["full"]
