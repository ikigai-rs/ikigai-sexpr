name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      wasm-lib: true
      # The arrangement surface alone, `default-features = false`: what a page in a browser
      # builds to mount `arrangement_space()` (ledger #649). The shared `no default features`
      # leg holds it to clippy (host and wasm32 lib), test and doc, and the forbid list keeps
      # it minimal: none of the code-graph codec's dependencies may be compiled.
      no-default-features: true
      no-default-features-forbid: "sha2 oxrdfio oxrdfxml oxjsonld"
